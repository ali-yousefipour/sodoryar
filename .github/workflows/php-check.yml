name: PHP syntax check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodoryar-php-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4 and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip, gd
          coverage: none
      - name: Check PHP syntax
        run: |
          set -euo pipefail
          find public src scripts tests integration -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Parse PHP without executing bootstrap or database code
        run: php tests/php-source-parse.php
      - name: Check required files
        run: test -s database/install.sql && test -s database/migrations/001_initial.sql && test -s database/migrations/002_login_rate_limit.sql && test -s database/migrations/003_user_permissions.sql && test -s database/migrations/004_global_drivers.sql && test -s database/migrations/005_user_photos.sql && test -s public/assets/app.css && test -s public/assets/refinements.css && test -s .env.example
      - name: Check browser scripts
        run: node --check public/assets/app.js && node --check public/assets/table-experience.js && node --check public/assets/report-progress.js
      - name: Verify Persian number, money and Jalali date formatting
        run: php tests/locale-formatting.php
      - name: Verify required driver mobile normalization
        run: php tests/invoice-driver-mobile.php
      - name: Verify Persian national-ID inputs for invoices and central drivers
        run: php tests/driver-national-input-digits.php
      - name: Verify safe national-code prefix rules
        run: php tests/driver-lookup-validation.php
      - name: Verify numeric login CAPTCHA
        run: php tests/login-captcha.php
      - name: Verify independent Excel export permissions
        run: php tests/report-export-permissions.php
      - name: Verify operator permissions cannot include manager-only grants
        run: php tests/operator-permission-policy.php
      - name: Verify company always retains at least one active administrator
        run: php tests/admin-roster-serialization.php
      - name: Verify password and access changes revoke earlier sessions
        run: php tests/auth-session-revocation.php
      - name: Verify auth session version belongs to users on clean install
        run: php tests/session-version-schema.php
      - name: Verify superadmin credential changes revoke manager sessions
        run: php tests/admin-manager-session-revocation.php
      - name: Verify tenant query index migration contracts
        run: php tests/tenant-query-indexes.php
      - name: Verify manager list avoids per-company N+1 queries
        run: php tests/company-admin-prefetch.php
      - name: Verify SQL driver errors never leak to users
        run: php tests/error-disclosure-policy.php
      - name: Verify deployment marker, TLS and database integration gates
        run: php tests/deploy-ownership-contract.php
      - name: Verify financial deletion and tenant access contracts
        run: |
          php tests/bill-deletion-policy.php
          php tests/tenant-security-contracts.php
      - name: Verify A5 and thermal print layout contracts
        run: php tests/print-layout-contracts.php
      - name: Verify dashboard ranking is accessible under strict CSP
        run: php tests/dashboard-csp-progress.php
      - name: Verify CSP permits safe company logo previews
        run: php tests/csp-company-logo.php
      - name: Verify company scoped print template editing
        run: php tests/print-template-edit.php
      - name: Verify Persian invoice amount words
        run: php tests/invoice-amount-words.php
      - name: Verify company-vs-own document-scope security contracts
        run: php tests/security-document-scopes.php
      - name: Verify bill and POS modules are reachable and permission-gated
        run: php tests/financial-module-routes.php
      - name: Verify payment edits and voids serialize correctly
        run: php tests/invoice-edit-void-serialization.php
      - name: Verify invoice history authorization before data access
        run: php tests/invoice-history-authorization.php
      - name: Verify Excel exports do not silently drop records
        run: php tests/report-export-completeness.php
      - name: Verify real-byte Excel download progress behavior
        run: php tests/report-download-progress.php
      - name: Verify cross-company user names are not joined into financial reports
        run: php tests/report-tenant-joins.php
