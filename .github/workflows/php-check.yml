name: PHP syntax check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find public src scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check required files
        run: test -s database/install.sql && test -s database/migrations/001_initial.sql && test -s database/migrations/002_login_rate_limit.sql && test -s database/migrations/003_user_permissions.sql && test -s public/assets/app.css && test -s .env.example
