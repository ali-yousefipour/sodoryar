name: Deploy Sodoryar to shared Linux host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodoryar-ftp-production
  cancel-in-progress: false

jobs:
  source-validation:
    name: Validate PHP 8.4, JavaScript and security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4 and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip, gd
          coverage: none
      - name: Validate source and regression tests without production access
        run: bash scripts/validate-release.sh

  database-integration:
    name: Validate isolated MySQL migrations and tenant boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: sodoryar-ci-only-password
          MARIADB_DATABASE: sodoryar_integration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SODORYAR_INTEGRATION: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: sodoryar_integration_test
      DB_USER: root
      DB_PASS: sodoryar-ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP 8.4 for MariaDB integration
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, zip, gd
          coverage: none
      - name: Verify migrations and two-company financial isolation
        run: php integration/mysql-tenant-smoke.php

  deploy:
    needs: [source-validation, database-integration]
    if: ${{ needs.source-validation.result == 'success' && needs.database-integration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build isolated host payload
        run: |
          set -euo pipefail
          mkdir -p deploy-payload/public deploy-payload/_private/src
          cp -a public/. deploy-payload/public/
          cp -a src/. deploy-payload/_private/src/
          cp -a deploy/private.htaccess deploy-payload/_private/.htaccess
          cp .env.example deploy-payload/_private/.env.example
          test -s deploy-payload/public/index.php
          test -s deploy-payload/_private/src/bootstrap.php
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > deploy-payload/public/sodoryar-version.json
          echo 'Deploying public/ to the Sodoryar root and protected application code to _private/.'

      - name: Verify FTP destination belongs to Sodoryar before changing files
        env:
          FTP_USER: ${{ secrets.ftp }}
          FTP_PASS: ${{ secrets.pass }}
          FTP_HOST: 2870352177.cloudylink.com
          FTP_REMOTE_DIR: ${{ vars.SODORYAR_FTP_REMOTE_DIR || '' }}
          FTPS_CA_PEM: ${{ secrets.FTPS_CA_PEM }}
        run: |
          set -euo pipefail
          # The shared FTP account also holds Khatyar. Never deploy to its parent/root.
          if [[ ! "$FTP_REMOTE_DIR" =~ ^/[a-zA-Z0-9_-]+([./-][a-zA-Z0-9_-]+)*(/[a-zA-Z0-9_-]+([.-][a-zA-Z0-9_-]+)*)*$ ]] \
             || [[ "$FTP_REMOTE_DIR" == *"/.."* ]] \
             || [[ "$FTP_REMOTE_DIR" == "/khat-yar.ir" ]] \
             || [[ "$FTP_REMOTE_DIR" == "/taxiranico.ir" ]] \
             || [[ "$FTP_REMOTE_DIR" == "/service-yar.ir" ]] \
             || [[ "$FTP_REMOTE_DIR" == "/app" ]]; then
            echo "::error::Unsafe or unspecified Sodoryar deployment directory."
            exit 1
          fi
          if [ -z "${FTP_USER}" ] || [ -z "${FTP_PASS}" ]; then
            echo "::error::Missing FTP secrets; target ownership cannot be verified."
            exit 1
          fi
          if ! command -v lftp >/dev/null 2>&1; then
            timeout 90s sudo apt-get update -qq
            timeout 90s sudo apt-get install -y -qq lftp
          fi
          # Existing protected marker must be placed by an authorized host admin.
          # A shared FTP account can otherwise overwrite an unrelated website.
          # Optional host CA trust anchor (PEM). Never disable certificate verification.
          ca_setting=""
          if [ -n "${FTPS_CA_PEM:-}" ]; then
            ca_file="$RUNNER_TEMP/sodoryar-ftps-ca.pem"
            printf '%s\n' "$FTPS_CA_PEM" > "$ca_file"
            chmod 600 "$ca_file"
            openssl x509 -in "$ca_file" -noout >/dev/null || {
              echo "::error::FTPS_CA_PEM is not a valid PEM certificate."
              exit 1
            }
            ca_setting="set ssl:ca-file $ca_file"
          fi
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          $ca_setting
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 3
          set net:timeout 30
          get "$FTP_REMOTE_DIR/_private/.sodoryar-instance" -o /tmp/sodoryar-ftp-target-marker
          bye
          EOF
          if ! grep -Fxq 'SODORYAR_DEPLOY_ROOT' /tmp/sodoryar-ftp-target-marker; then
            echo "::error::Refusing deploy: target marker is missing or does not match Sodoryar."
            exit 1
          fi

      - name: Upload through FTP with host-compatible TLS
        env:
          FTP_USER: ${{ secrets.ftp }}
          FTP_PASS: ${{ secrets.pass }}
          FTP_HOST: 2870352177.cloudylink.com
          FTP_REMOTE_DIR: ${{ vars.SODORYAR_FTP_REMOTE_DIR || '' }}
          FTPS_CA_PEM: ${{ secrets.FTPS_CA_PEM }}
        run: |
          set -euo pipefail
          # The shared FTP account also holds Khatyar. Never deploy to its parent/root.
          if [[ ! "$FTP_REMOTE_DIR" =~ ^/[a-zA-Z0-9_-]+([./-][a-zA-Z0-9_-]+)*(/[a-zA-Z0-9_-]+([.-][a-zA-Z0-9_-]+)*)*$ ]] \
             || [[ "$FTP_REMOTE_DIR" == *"/.."* ]] \
             || [[ "$FTP_REMOTE_DIR" == "/khat-yar.ir" ]] \
             || [[ "$FTP_REMOTE_DIR" == "/taxiranico.ir" ]] \
             || [[ "$FTP_REMOTE_DIR" == "/service-yar.ir" ]] \
             || [[ "$FTP_REMOTE_DIR" == "/app" ]]; then
            echo "::error::Unsafe or unspecified Sodoryar deployment directory."
            exit 1
          fi
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo 'Required GitHub secrets ftp and pass are missing.' >&2
            exit 1
          fi
          if ! command -v lftp >/dev/null 2>&1; then
            if ! timeout 90s sudo apt-get install -y -qq lftp; then
              timeout 90s sudo apt-get update -qq
              timeout 90s sudo apt-get install -y -qq lftp
            fi
          fi
          # Require verified FTPS server identity. Fix the host certificate/CA chain
          # before deployment rather than bypassing TLS identity verification.
          # Never delete files from the remote host: the database and .env are managed separately.
          # Optional host CA trust anchor (PEM). Never disable certificate verification.
          ca_setting=""
          if [ -n "${FTPS_CA_PEM:-}" ]; then
            ca_file="$RUNNER_TEMP/sodoryar-ftps-ca.pem"
            printf '%s\n' "$FTPS_CA_PEM" > "$ca_file"
            chmod 600 "$ca_file"
            openssl x509 -in "$ca_file" -noout >/dev/null || {
              echo "::error::FTPS_CA_PEM is not a valid PEM certificate."
              exit 1
            }
            ca_setting="set ssl:ca-file $ca_file"
          fi
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          $ca_setting
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 5
          set net:timeout 60
          set net:reconnect-interval-base 2
          mirror -R --verbose --no-perms --parallel=2 deploy-payload/_private "$FTP_REMOTE_DIR/_private"
          mirror -R --verbose --no-perms --parallel=2 deploy-payload/public "$FTP_REMOTE_DIR"
          bye
          EOF

      - name: Verify deployed application commit manifest
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "https://taxiranico.ir/sodoryar-version.json?deploy=${GITHUB_SHA}" \
            -o /tmp/sodoryar-deployed-version.json
          php -r '
            $info=json_decode((string)file_get_contents("/tmp/sodoryar-deployed-version.json"),true);
            if(!is_array($info) || ($info["commit"]??"") !== getenv("GITHUB_SHA")) {
              fwrite(STDERR,"Deployed version does not match the triggering commit.\n");
              exit(1);
            }
            echo "Deployed application commit verified.\n";
          '

      - name: Verify public invoice stylesheet matches deployed commit
        run: |
          set -euo pipefail
          expected="$(sha256sum public/assets/invoice-redesign.css | cut -d' ' -f1)"
          # A unique URL and no-cache headers bypass stale browser/CDN copies.
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "https://taxiranico.ir/assets/invoice-redesign.css?deploy=${GITHUB_SHA}" \
            -o /tmp/sodoryar-invoice-live.css
          actual="$(sha256sum /tmp/sodoryar-invoice-live.css | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Hosted domain is serving a different invoice-redesign.css. Verify FTP remote directory, domain document root and caches."
            echo "Expected SHA256: $expected"
            echo "Live SHA256: $actual"
            exit 1
          fi
          echo "Hosted CSS matches this exact commit ($expected)."

      - name: Verify global UI stylesheet and script are served from the deployed commit
        run: |
          set -euo pipefail
          for file in ux-unified.css iam-ux.css print-engine.css app.js table-experience.js report-progress.js; do
            local_file="public/assets/$file"
            expected="$(sha256sum "$local_file" | cut -d' ' -f1)"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 3 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "https://taxiranico.ir/assets/$file?deploy=${GITHUB_SHA}" \
              -o "/tmp/sodoryar-live-$file"
            actual="$(sha256sum "/tmp/sodoryar-live-$file" | cut -d' ' -f1)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::Live $file does not match the deployed commit."
              exit 1
            fi
            echo "Verified deployed $file ($expected)"
          done

      - name: Deployment notes
        run: |
          echo 'Contents of public/ uploaded directly to the FTP account root.'
          echo 'Protected PHP source uploaded to _private/src alongside index.php.'
          echo 'Copy _private/.env.example to _private/.env on the host and set DB_PASS manually.'
