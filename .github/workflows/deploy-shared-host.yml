name: Deploy Sodoryar to shared Linux host

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodoryar-ftp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify PHP syntax and JavaScript
        run: |
          set -euo pipefail
          find public src -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check public/assets/app.js

      - name: Build isolated host payload
        run: |
          set -euo pipefail
          mkdir -p deploy-payload/public deploy-payload/src
          cp -a public/. deploy-payload/public/
          cp -a src/. deploy-payload/src/
          test -s deploy-payload/public/index.php
          test -s deploy-payload/src/bootstrap.php
          echo 'Deploying public/ and src/ only. Environment secrets and database imports are excluded.'

      - name: Upload through FTP with host-compatible TLS
        env:
          FTP_USER: ${{ secrets.ftp }}
          FTP_PASS: ${{ secrets.pass }}
          FTP_HOST: 2870352177.cloudylink.com
          FTP_REMOTE_DIR: svg
        run: |
          set -euo pipefail
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo 'Required GitHub secrets ftp and pass are missing.' >&2
            exit 1
          fi
          if ! command -v lftp >/dev/null 2>&1; then
            if ! timeout 90s sudo apt-get install -y -qq lftp; then
              timeout 90s sudo apt-get update -qq
              timeout 90s sudo apt-get install -y -qq lftp
            fi
          fi
          # The shared host uses a certificate with an untrusted issuer (also handled
          # in Khatyar's deployment). Keep TLS encryption mandatory while accepting
          # that server identity cannot be validated until the host certificate is fixed.
          # Never delete files from the remote host: the database and .env are managed separately.
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST:21" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 5
          set net:timeout 60
          set net:reconnect-interval-base 2
          mkdir -p "$FTP_REMOTE_DIR"
          mirror -R --verbose --no-perms --parallel=2 deploy-payload "$FTP_REMOTE_DIR"
          bye
          EOF

      - name: Deployment notes
        run: |
          echo 'Files uploaded to svg/public and svg/src.'
          echo 'The host document root must point to svg/public.'
          echo 'The host-side .env and MySQL schema must be configured separately.'
