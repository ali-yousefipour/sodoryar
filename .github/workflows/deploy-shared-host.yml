name: Deploy Sodoryar to shared Linux host

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodoryar-ftp-production
  cancel-in-progress: false

jobs:
  source-validation:
    name: Validate PHP 8.4, JavaScript and security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP 8.4 and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip, gd
          coverage: none
      - name: Install locked PDF runtime dependencies
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-scripts --no-progress
          composer check-platform-reqs --no-dev
          composer audit --no-dev
      - name: Validate source and regression tests without production access
        run: bash scripts/validate-release.sh
      - name: Set up Python for Chromium UI and print checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify responsive financial UI and A4/A5/80mm printing in Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python scripts/browser-ui-print-smoke.py

  database-integration:
    name: Validate isolated MySQL migrations and tenant boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: sodoryar-ci-only-password
          MARIADB_DATABASE: sodoryar_integration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SODORYAR_INTEGRATION: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: sodoryar_integration_test
      DB_USER: root
      DB_PASS: sodoryar-ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP 8.4 for MariaDB integration
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, zip, gd
          coverage: none
      - name: Install locked PDF runtime for database and browser checks
        # Dependencies are installed here too because this job runs on a separate runner.
        run: composer install --no-dev --prefer-dist --no-interaction --no-scripts --no-progress
      - name: Verify expense migrations and financial isolation
        run: php integration/expense-ledger-smoke.php
      - name: Install MariaDB client for isolated backup and recovery verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
      - name: Verify complete restore and financial checksums on disposable database
        run: bash scripts/verify-disposable-restore.sh
      - name: Set up Python for isolated financial browser E2E
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise real PHP login, financial posting, PDF and tenant boundaries
        env:
          SESSION_SECURE: '0'
          APP_ENV: development
          SODORYAR_E2E_ORIGIN: http://127.0.0.1:8089
        run: |
          set -euo pipefail
          php integration/browser-financial-seed.php
          python -m pip install --disable-pip-version-check playwright==1.56.0
          site="$RUNNER_TEMP/sodoryar-browser-site"
          mkdir -p "$site/_private/src"
          cp -a public/. "$site/"
          cp -a src/. "$site/_private/src/"
          cp -a vendor "$site/_private/vendor"
          php -S 127.0.0.1:8089 -t "$site" > "$RUNNER_TEMP/sodoryar-php-e2e.log" 2>&1 &
          server_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then tail -n 100 "$RUNNER_TEMP/sodoryar-php-e2e.log" || true; fi; kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 'http://127.0.0.1:8089/?page=login' -o /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "::error::Isolated PHP test server failed to start."
            exit 1
          fi
          python scripts/browser-financial-e2e.py
          python scripts/browser-expense-ledger-e2e.py
      - name: Save disposable browser QA screenshots and print sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodoryar-financial-browser-qa
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [source-validation, database-integration]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.source-validation.result == 'success' && needs.database-integration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure PHP for locked PDF dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, zip, gd
          coverage: none
      - name: Install verified production dependencies
        run: |
          test -s composer.lock
          composer install --no-dev --prefer-dist --no-interaction --no-scripts --no-progress --optimize-autoloader
          composer check-platform-reqs --no-dev
      - name: Validate isolated Sodoryar target and public origin before upload
        env:
          FTP_REMOTE_DIR: ${{ vars.SODORYAR_FTP_REMOTE_DIR || '.' }}
          SODORYAR_PUBLIC_BASE_URL: https://taxiranico.ir
        run: |
          set -euo pipefail
          # Shared host also contains Khatyar and ServiceYar. Configuration is explicit.
          if [[ -z "$SODORYAR_PUBLIC_BASE_URL" ]]; then
            echo "::error::Sodoryar public HTTPS origin must not be empty."
            exit 1
          fi
          # This FTP account is jailed directly to the Sodoryar document root.
          # Reject every other path, including another application's directory.
          if [[ "$FTP_REMOTE_DIR" != "." ]]; then
            echo "::error::Dedicated Sodoryar FTP account must deploy to its own root (.)."
            exit 1
          fi
          if [[ ! "$SODORYAR_PUBLIC_BASE_URL" =~ ^https://[A-Za-z0-9][A-Za-z0-9.-]*(:443)?$ ]] ||
             [[ "$SODORYAR_PUBLIC_BASE_URL" == "https://service-yar.ir" ]] ||
             [[ "$SODORYAR_PUBLIC_BASE_URL" == "https://khat-yar.ir" ]]; then
            echo "::error::Refusing the shared ServiceYar/Khatyar public URL."
            exit 1
          fi
          echo "Sodoryar deployment target and public URL have independent shapes; ownership challenge or marker verification follows."

      - name: Build isolated host payload
        run: |
          set -euo pipefail
          mkdir -p deploy-payload/public deploy-payload/_private/src
          cp -a public/. deploy-payload/public/
          cp -a src/. deploy-payload/_private/src/
          cp -a vendor deploy-payload/_private/vendor
          cp -a deploy/private.htaccess deploy-payload/_private/.htaccess
          cp .env.example deploy-payload/_private/.env.example
          test -s deploy-payload/public/index.php
          test -s deploy-payload/_private/src/bootstrap.php
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > deploy-payload/public/sodoryar-version.json
          echo 'Deploying public/ to the Sodoryar root and protected application code to _private/.'

      - name: Verify FTP destination belongs to Sodoryar before changing files
        env:
          FTP_USER: ${{ secrets.ftp }}
          FTP_PASS: ${{ secrets.pass }}
          FTP_HOST: 2870352177.cloudylink.com
          FTP_REMOTE_DIR: ${{ vars.SODORYAR_FTP_REMOTE_DIR || '.' }}
        run: |
          set -euo pipefail
          # Dedicated account is jailed at Sodoryar root. Refuse non-root paths.
          if [[ "$FTP_REMOTE_DIR" != "." ]]; then
            echo "::error::Unsafe or unspecified Sodoryar deployment directory."
            exit 1
          fi
          if [ -z "${FTP_USER}" ] || [ -z "${FTP_PASS}" ]; then
            echo "::error::Missing FTP secrets; target ownership cannot be verified."
            exit 1
          fi
          if ! command -v lftp >/dev/null 2>&1; then
            timeout 90s sudo apt-get update -qq
            timeout 90s sudo apt-get install -y -qq lftp
          fi
          # FTP account owner has confirmed that its jailed root is Sodoryar.
          # Check any existing marker, but never trust confirmation alone: for
          # marker-free installs, prove FTP root serves the declared HTTPS origin.
          marker_file="$RUNNER_TEMP/sodoryar-ftp-target-marker"
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" <<EOF || true
          set cmd:fail-exit no
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 3
          set net:timeout 30
          get "_private/.sodoryar-instance" -o "$marker_file"
          bye
          EOF
          if [[ -f "$marker_file" ]]; then
            if ! grep -Fxq 'SODORYAR_DEPLOY_ROOT' "$marker_file"; then
              echo "::error::Existing FTP destination marker does not identify Sodoryar."
              exit 1
            fi
          else
            challenge="sodoryar-ownership-$(openssl rand -hex 16).txt"
            challenge_value="$(openssl rand -hex 32)"
            printf '%s\n' "$challenge_value" > "$RUNNER_TEMP/$challenge"
            lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 3
          set net:timeout 30
          put "$RUNNER_TEMP/$challenge" -o "$challenge"
          bye
          EOF
            trap 'lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" -e "set ftp:ssl-allow false; rm $challenge; bye" >/dev/null 2>&1 || true' EXIT
            observed="$(curl --fail --silent --show-error --max-time 30 --retry 2 --retry-delay 2 "https://taxiranico.ir/$challenge" || true)"
            if [[ "$observed" != "$challenge_value" ]]; then
              echo "::error::FTP root does not serve the declared Sodoryar HTTPS domain. No application files were uploaded."
              exit 1
            fi
            printf '%s\n' 'SODORYAR_DEPLOY_ROOT' > "$RUNNER_TEMP/sodoryar-marker"
            lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 3
          set net:timeout 30
          mkdir -p _private
          put "$RUNNER_TEMP/sodoryar-marker" -o "_private/.sodoryar-instance"
          get "_private/.sodoryar-instance" -o "$marker_file"
          rm "$challenge"
          bye
          EOF
            trap - EXIT
            if ! grep -Fxq 'SODORYAR_DEPLOY_ROOT' "$marker_file"; then
              echo "::error::New destination marker failed verification."
              exit 1
            fi
          fi

      - name: Upload through dedicated FTP account
        env:
          FTP_USER: ${{ secrets.ftp }}
          FTP_PASS: ${{ secrets.pass }}
          FTP_HOST: 2870352177.cloudylink.com
          FTP_REMOTE_DIR: ${{ vars.SODORYAR_FTP_REMOTE_DIR || '.' }}
        run: |
          set -euo pipefail
          # Dedicated account is jailed at Sodoryar root. Refuse non-root paths.
          if [[ "$FTP_REMOTE_DIR" != "." ]]; then
            echo "::error::Unsafe or unspecified Sodoryar deployment directory."
            exit 1
          fi
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo 'Required GitHub secrets ftp and pass are missing.' >&2
            exit 1
          fi
          if ! command -v lftp >/dev/null 2>&1; then
            if ! timeout 90s sudo apt-get install -y -qq lftp; then
              timeout 90s sudo apt-get update -qq
              timeout 90s sudo apt-get install -y -qq lftp
            fi
          fi
          # Incremental transfer avoids retransmitting unchanged dependencies on every commit.
          # Critical files are read back and compared with the checkout after upload.
          # Do not delete remote files. Database and .env remain managed separately.
          # FTP without TLS transmits credentials and data without transport encryption.
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 5
          set net:timeout 60
          set net:reconnect-interval-base 2
          mirror -R --verbose --no-perms --parallel=2 deploy-payload/_private "$FTP_REMOTE_DIR/_private"
          mirror -R --verbose --no-perms --parallel=2 deploy-payload/public "$FTP_REMOTE_DIR"
          bye
          EOF

      - name: Verify deployed private PHP files match the triggering commit
        env:
          FTP_USER: ${{ secrets.ftp }}
          FTP_PASS: ${{ secrets.pass }}
          FTP_HOST: 2870352177.cloudylink.com
        run: |
          set -euo pipefail
          # Read-only FTP readback: verify the critical private source that
          # the public PHP router uses; never expose PHP source over HTTPS.
          for file in bootstrap.php modules.php localization.php reporting.php invoice_numbers.php cashbox.php expenses.php expenses_page.php expense_workflow.php expense_settlement.php expense_returns.php expense_reports.php expense_report_center.php expense_pdf.php finance_schema_health.php; do
            test -s "deploy-payload/_private/src/$file"
          done
          lftp --user "$FTP_USER" --password "$FTP_PASS" "ftp://$FTP_HOST:21" <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-allow false
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 3
          set net:timeout 30
          get "_private/src/bootstrap.php" -o "$RUNNER_TEMP/sodoryar-readback-bootstrap.php"
          get "_private/src/modules.php" -o "$RUNNER_TEMP/sodoryar-readback-modules.php"
          get "_private/src/localization.php" -o "$RUNNER_TEMP/sodoryar-readback-localization.php"
          get "_private/src/reporting.php" -o "$RUNNER_TEMP/sodoryar-readback-reporting.php"
          get "_private/src/invoice_numbers.php" -o "$RUNNER_TEMP/sodoryar-readback-invoice_numbers.php"
          get "_private/src/cashbox.php" -o "$RUNNER_TEMP/sodoryar-readback-cashbox.php"
          get "_private/src/expenses.php" -o "$RUNNER_TEMP/sodoryar-readback-expenses.php"
          get "_private/src/expenses_page.php" -o "$RUNNER_TEMP/sodoryar-readback-expenses_page.php"
          get "_private/src/expense_workflow.php" -o "$RUNNER_TEMP/sodoryar-readback-expense_workflow.php"
          get "_private/src/expense_settlement.php" -o "$RUNNER_TEMP/sodoryar-readback-expense_settlement.php"
          get "_private/src/expense_returns.php" -o "$RUNNER_TEMP/sodoryar-readback-expense_returns.php"
          get "_private/src/expense_reports.php" -o "$RUNNER_TEMP/sodoryar-readback-expense_reports.php"
          get "_private/src/expense_report_center.php" -o "$RUNNER_TEMP/sodoryar-readback-expense_report_center.php"
          get "_private/src/expense_pdf.php" -o "$RUNNER_TEMP/sodoryar-readback-expense_pdf.php"
          get "_private/src/finance_schema_health.php" -o "$RUNNER_TEMP/sodoryar-readback-finance_schema_health.php"
          get "_private/vendor/autoload.php" -o "$RUNNER_TEMP/sodoryar-readback-autoload.php"
          get "_private/src/fonts/Vazirmatn-Regular.ttf" -o "$RUNNER_TEMP/sodoryar-readback-Vazirmatn-Regular.ttf"
          get "_private/src/fonts/Vazirmatn-Bold.ttf" -o "$RUNNER_TEMP/sodoryar-readback-Vazirmatn-Bold.ttf"
          bye
          EOF
          for file in bootstrap.php modules.php localization.php reporting.php invoice_numbers.php cashbox.php expenses.php expenses_page.php expense_workflow.php expense_settlement.php expense_returns.php expense_reports.php expense_report_center.php expense_pdf.php finance_schema_health.php; do
            expected="$(sha256sum "deploy-payload/_private/src/$file" | cut -d' ' -f1)"
            actual="$(sha256sum "$RUNNER_TEMP/sodoryar-readback-$file" | cut -d' ' -f1)"
            if [[ "$expected" != "$actual" ]]; then
              echo "::error::Private PHP file $file does not match the commit after FTP upload."
              exit 1
            fi
            echo "Verified private PHP source: $file"
          done
          for file in vendor/autoload.php src/fonts/Vazirmatn-Regular.ttf src/fonts/Vazirmatn-Bold.ttf; do
            expected="$(sha256sum "deploy-payload/_private/$file" | cut -d' ' -f1)"
            actual="$(sha256sum "$RUNNER_TEMP/sodoryar-readback-${file##*/}" | cut -d' ' -f1)"
            test "$expected" = "$actual" || { echo "::error::Private dependency $file does not match the commit."; exit 1; }
          done

      - name: Verify deployed application commit manifest
        env:
          SODORYAR_PUBLIC_BASE_URL: https://taxiranico.ir

        run: |
          set -euo pipefail
          # Verify only an explicitly assigned independent HTTPS origin.
          if [[ ! "$SODORYAR_PUBLIC_BASE_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*(:443)?$ ]] ||
             [[ "$SODORYAR_PUBLIC_BASE_URL" == "https://service-yar.ir" ]] ||
             [[ "$SODORYAR_PUBLIC_BASE_URL" == "https://khat-yar.ir" ]]; then
            echo "::error::Expected the fixed Sodoryar HTTPS origin."
            exit 1
          fi
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "${SODORYAR_PUBLIC_BASE_URL}/sodoryar-version.json?deploy=${GITHUB_SHA}" \
            -o /tmp/sodoryar-deployed-version.json
          php -r '
            $info=json_decode((string)file_get_contents("/tmp/sodoryar-deployed-version.json"),true);
            if(!is_array($info) || ($info["commit"]??"") !== getenv("GITHUB_SHA")) {
              fwrite(STDERR,"Deployed version does not match the triggering commit.\n");
              exit(1);
            }
            echo "Deployed application commit verified.\n";
          '

      - name: Verify public invoice stylesheet matches deployed commit
        env:
          SODORYAR_PUBLIC_BASE_URL: https://taxiranico.ir

        run: |
          set -euo pipefail
          # Verify only an explicitly assigned independent HTTPS origin.
          if [[ ! "$SODORYAR_PUBLIC_BASE_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*(:443)?$ ]] ||
             [[ "$SODORYAR_PUBLIC_BASE_URL" == "https://service-yar.ir" ]] ||
             [[ "$SODORYAR_PUBLIC_BASE_URL" == "https://khat-yar.ir" ]]; then
            echo "::error::Expected the fixed Sodoryar HTTPS origin."
            exit 1
          fi
          expected="$(sha256sum public/assets/invoice-redesign.css | cut -d' ' -f1)"
          # A unique URL and no-cache headers bypass stale browser/CDN copies.
          curl --fail --location --silent --show-error --retry 4 --retry-delay 3 --max-time 30 \
            -H 'Cache-Control: no-cache' \
            "${SODORYAR_PUBLIC_BASE_URL}/assets/invoice-redesign.css?deploy=${GITHUB_SHA}" \
            -o /tmp/sodoryar-invoice-live.css
          actual="$(sha256sum /tmp/sodoryar-invoice-live.css | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Hosted domain is serving a different invoice-redesign.css. Verify FTP remote directory, domain document root and caches."
            echo "Expected SHA256: $expected"
            echo "Live SHA256: $actual"
            exit 1
          fi
          echo "Hosted CSS matches this exact commit ($expected)."

      - name: Verify global UI stylesheet and script are served from the deployed commit
        env:
          SODORYAR_PUBLIC_BASE_URL: https://taxiranico.ir

        run: |
          set -euo pipefail
          # Verify only an explicitly assigned independent HTTPS origin.
          if [[ ! "$SODORYAR_PUBLIC_BASE_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*(:443)?$ ]] ||
             [[ "$SODORYAR_PUBLIC_BASE_URL" == "https://service-yar.ir" ]] ||
             [[ "$SODORYAR_PUBLIC_BASE_URL" == "https://khat-yar.ir" ]]; then
            echo "::error::Expected the fixed Sodoryar HTTPS origin."
            exit 1
          fi
          for file in ux-unified.css iam-ux.css print-engine.css login-experience.css workspace-refresh.css login-ui.js app.js table-experience.js report-progress.js expenses.css expenses.js; do
            local_file="public/assets/$file"
            expected="$(sha256sum "$local_file" | cut -d' ' -f1)"
            curl --fail --location --silent --show-error --retry 4 --retry-delay 3 --max-time 30 \
              -H 'Cache-Control: no-cache' \
              "${SODORYAR_PUBLIC_BASE_URL}/assets/$file?deploy=${GITHUB_SHA}" \
              -o "/tmp/sodoryar-live-$file"
            actual="$(sha256sum "/tmp/sodoryar-live-$file" | cut -d' ' -f1)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::Live $file does not match the deployed commit."
              exit 1
            fi
            echo "Verified deployed $file ($expected)"
          done

      - name: Verify live anonymous PHP session and CSRF stability
        run: |
          set -euo pipefail
          origin="https://taxiranico.ir"
          jar="$RUNNER_TEMP/sodoryar-session-cookie.txt"
          first="$RUNNER_TEMP/sodoryar-login-first.html"
          second="$RUNNER_TEMP/sodoryar-login-second.html"
          curl --fail --silent --show-error --max-time 30 --cookie-jar "$jar" "$origin/?page=login" -o "$first"
          curl --fail --silent --show-error --max-time 30 --cookie "$jar" "$origin/?page=login" -o "$second"
          first_token="$(grep -oE 'name="csrf" value="[a-f0-9]{64}"' "$first" | head -n 1)"
          second_token="$(grep -oE 'name="csrf" value="[a-f0-9]{64}"' "$second" | head -n 1)"
          if [[ -z "$first_token" || "$first_token" != "$second_token" ]]; then
            echo "::error::Anonymous PHP session did not persist the same CSRF token across requests."
            exit 1
          fi
          if ! grep -Fq 'assets/login-experience.css?v=' "$first"; then
            echo "::error::Live login HTML is missing the new dedicated stylesheet; PHP page or deployed index.php is stale."
            exit 1
          fi
          if ! grep -Fq 'class="login-layout"' "$first"; then
            echo "::error::Live login HTML is missing the expected branded layout."
            exit 1
          fi
          if ! grep -q 'sodoryar_session' "$jar"; then
            echo "::error::Login did not set Sodoryar session cookie."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 "$origin/favicon.svg" -o /dev/null
          curl --fail --silent --show-error --max-time 30 "$origin/favicon.ico" -o /dev/null
          echo 'Live login session, CSRF consistency and favicon passed.'

      - name: Verify private application files cannot be served publicly
        run: |
          set -euo pipefail
          origin="https://taxiranico.ir"
          for private_path in "_private/.env.example" "_private/src/bootstrap.php" "_private/src/expense_pdf.php" "_private/vendor/autoload.php" "_private/.sodoryar-instance"; do
            status="$(curl --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}' "$origin/$private_path")"
            case "$status" in
              403|404|410) echo "Private-path access blocked: $private_path (HTTP $status)" ;;
              *) echo "::error::Private application path unexpectedly responded with HTTP $status: $private_path"; exit 1 ;;
            esac
          done

      - name: Deployment notes
        run: |
          echo 'Contents of public/ uploaded directly to the FTP account root.'
          echo 'Protected PHP source uploaded to _private/src alongside index.php.'
          echo 'Copy _private/.env.example to _private/.env on the host and set DB_PASS manually.'
